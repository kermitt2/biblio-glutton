version: 0.4.0

# where the compiled metadata are stored, it takes more than 200GB for all Crossref, OpenAlex, PubMed and ISTEX mappings, 
# this is a single location for all compiled resources  
storage: data/db
#storage: /media/lopez/data/glutton-data/data/db

# batch size for preparing the data
storingBatchSize: 10000
indexingBatchSize: 10000

# max blocking size (number of candidates considered for pairwise matching)
blockSize: 4

# Grobid server URL
grobidHost: http://localhost:8070/api

timeZone: UTC
# the day hour for lauching the automatic daily incremental update, format is HH:MM
dailyUpdateTime: 03:00

# define the search infrastructure to be used, possible values are "elasticSearch" or "solr"
searchEngine: elasticSearch
#searchEngine: solr

# a node of the ElasticSearch cluster to be used and a name for the main index
elastic:
  #host: localhost:9200
  host: 0.0.0.0:9200
  #host: 192.168.1.30:9200
  index: glutton
  maxConnections: 20
  # for the loading and update commands: seconds to wait for a connection and for the answer to a
  # bulk of records. Elasticsearch takes more than the default 30s for a full bulk when it is busy,
  # and a bulk that times out is retried, so keep this generous
  connectTimeout: 30
  socketTimeout: 120
  # how many bulks of records are sent at the same time while loading. Beyond that the loading
  # waits for Elasticsearch instead of piling up requests that would only time out
  maxConcurrentBulks: 4

# solr settings
solr:
  host: 0.0.0.0:8983
  core: glutton

proxy:
    # proxy to be used when doing external call to crossref or openalex
    host: 
    port: 

crossref:
  # Crossref fields to be ignored when storing metadata, reference field in particular takes a lot of space
  ignoreCrossrefFields: 
    - reference
    - abstract
    - indexed

  # a directory where the crossref incremental update files (gap or daily update) will be located
  # to be changed according to your storage
  dumpPath: /media/lopez/data/crossref

  # indicate if we remove the incremental files after they have been processed (value true) or if
  # keep them in the above dumpPath (careful the volume of files can be huge after months of daily update!)
  cleanProcessFiles: true

  # for the crossref REST API and daily update, you need normally to use it politely and to indicate an email 
  #address here, e.g. 
  #mailto: "toto@titi.tutu"
  mailto: 
  
  # to use Crossref metadata plus service (available by subscription)
  #token: "yourmysteriouscrossrefmetadataplusauthorizationtokentobeputhere"
  token:

# the following is used only for pubmed related enrichments and extractions
#pubmed:
  # path to the medline downloaded resources, to be changed according to your storage
  #pubmedDirectory: /media/lopez/data2/medline_2023
  # path to PMC mapping data
  #pmcDirectory: data/pmc
  # elasticsearch index for pubmed, used to create extraction based on MeSH terms
  #index: pubmed
  # path to the working pubmed databases, to be changed according to your storage 
  #dbDirectory: /media/lopez/T51/data2/db

hal: 
  # OAI PMH endpoint for harvesting HAL metadata
  api: "https://api.archives-ouvertes.fr/oai/hal"

dblp:
  # URL of the DBLP metadata dump
  dump: "https://dblp.uni-trier.de/xml/dblp.xml.gz"

# Reading any ingestion input from S3. Every --input below also takes an s3://bucket/key or
# s3://bucket/prefix/ location, so a snapshot can be read straight out of a bucket rather than
# downloaded first. With this block left as is, the standard AWS resolution chain (environment,
# ~/.aws, instance role) is used and unsigned access is the fallback when it finds nothing or
# when what it finds is refused -- which is what public buckets such as the OpenAlex snapshot need.
s3:
  region: "us-east-1"
  # accessKey: ""
  # secretKey: ""
  # set to true to always skip signing, false to make a credentials problem an error
  # anonymous:
  # endpoint and path style access are for MinIO and the other S3-compatible stores
  # endpoint: "http://localhost:9000"
  # pathStyleAccess: false
  # a stream cut short by a network hiccup is resumed with a ranged re-request, this many times
  maxRetries: 5

openAlex:
  # Neither of these is needed to load the snapshot, which is CC0 and needs no account:
  #   ./gradlew openalex -Pinput=s3://openalex/data/jsonl/works/
  # They apply only to `openalex --since`, which tops up an existing database from the API.
  #
  # A contact address. Since February 2026 this no longer buys a better rate limit -- OpenAlex
  # retired the polite pool -- so it is sent in the User-Agent as a courtesy, nothing more.
  #mailto: "toto@titi.tutu"
  mailto:
  # API key. Calls have been metered since February 2026, and the from_updated_date filter that
  # --since relies on needs a paid plan. See https://openalex.org/pricing
  apiKey:

# CORS parameters 
corsAllowedOrigins: "*"
corsAllowedMethods: "OPTIONS,GET,PUT,POST,DELETE,HEAD"
corsAllowedHeaders: "X-Requested-With,Content-Type,Accept,Origin"

# beyond the following number of requests, a 503 status will be returned (service unavailable) until enough
# requests are processed to go beyond the max
maxAcceptedRequests: 2048

server:
  type: default
  applicationConnectors:
  - type: http
    port: 8080
  adminConnectors:
  - type: http
    port: 8081
  registerDefaultExceptionMappers: false
  maxThreads: 2048
  # note: `maxQueuedRequests` was removed in Dropwizard 5 (Jetty 12); the application-level
  # `maxAcceptedRequests` above is what caps concurrent work in biblio-glutton.
  # change the following for having all http requests logged
  requestLog:
    appenders: []

# logging:
#  level: INFO
#  appenders:
#  - type: console
#    threshold: WARN
#    timeZone: UTC
#  - type: file
#    currentLogFilename: logs/lookup-service.log
#    threshold: INFO
#    archive: true
#    archivedLogFilenamePattern: logs/lookup-service-%d.log
#    archivedFileCount: 5
#    timeZone: UTC

# these logging settings apply to the service usage mode
logging:
  level: INFO
  loggers:
    org.glassfish.jersey.internal: "OFF"
    com.squarespace.jersey2.guice.JerseyGuiceUtils: "OFF"
  appenders:
    - type: console
      threshold: INFO
      timeZone: UTC
      # uncomment to have the logs in json format
      #layout:
      #  type: json
    - type: file
      currentLogFilename: logs/biblio-glutton.log
      threshold: INFO
      archive: true
      archivedLogFilenamePattern: logs/biblio-glutton-%d.log
      archivedFileCount: 5
      timeZone: UTC
      # uncomment to have the logs in json format
      #layout:
      #  type: json
