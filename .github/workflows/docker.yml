# Builds the Docker image of biblio-glutton, checks that it starts, and publishes it to the
# GitHub Container Registry as ghcr.io/<owner>/biblio-glutton (see doc/Docker.md).
#
#   pull request      build for linux/amd64 and check it starts; nothing is published
#   push to master    publish :latest and :sha-<commit>, for linux/amd64 and linux/arm64
#   tag 0.4.1         publish :0.4.1 as well
#   by hand           Actions > Docker image > Run workflow

name: Docker image

on:
  push:
    branches: [master]
    tags: ['[0-9]*']
    paths-ignore: ['doc/**', '**/*.md', 'mkdocs.yml', 'readthedocs.yml', 'scripts/**']
  pull_request:
    paths-ignore: ['doc/**', '**/*.md', 'mkdocs.yml', 'readthedocs.yml', 'scripts/**']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build for linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: biblio-glutton:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check that the image starts and answers
        run: |
          docker run --rm biblio-glutton:test --help | grep -q crossref
          docker run -d --name glutton -p 8080:8080 -e JAVA_OPTS=-Xmx1g biblio-glutton:test
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/service/data > data.json; then break; fi
            sleep 2
          done
          cat data.json; echo
          grep -q '"ROR size (LMDB)"' data.json
          # a lookup goes through the storage: an unknown funder is a 404, not an error
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/service/lookup/funder?doi=10.13039/100012950')" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/service/lookup/ror?id=not-an-id')" = 400

      - name: Logs of the service
        if: always()
        run: docker logs glutton 2>&1 | tail -100 || true

      - name: Image names and tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/biblio-glutton
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish for linux/amd64 and linux/arm64
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
