buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url = 'https://plugins.gradle.org/m2/'
        }
        //jcenter()
    }

    dependencies {
        classpath "com.gradleup.shadow:shadow-gradle-plugin:9.6.1"
    }
}

apply plugin: 'application'
apply plugin: 'java'
apply plugin: 'java-library'
//apply plugin: 'maven'
apply plugin: 'maven-publish'
apply plugin: 'com.gradleup.shadow'

group = 'com.scienceminer.glutton'
version = '0.4.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

repositories {
    // NOTE: pubmed-glutton imports com.scienceminer.glutton.data.db.{KBEnvironment, KBStagingEnvironment}
    // which are NOT in this repository's source tree. They were originally hosted in a local
    // Maven repo on the original developer's workstation (file:////home/lopez/...). If you need
    // to build this subproject, drop the JARs into a local lib directory and add a flatDir or
    // file-based maven repo here. See pubmed-glutton/Readme.md for context.
    mavenLocal()
    mavenCentral()
}

wrapper {
    gradleVersion = "9.7.1"
}

// The main class of the application
application {
    mainClass = 'com.scienceminer.glutton.main.Main'
}
tasks.named('run') {
    workingDir = rootProject.rootDir
}

dependencies {
    implementation "commons-io:commons-io:2.5"
    implementation "org.apache.httpcomponents:httpclient:4.5.3"
    implementation "org.apache.httpcomponents:httpmime:4.5.3"
    implementation "org.apache.commons:commons-lang3:3.5"
    implementation "org.apache.commons:commons-collections4:4.1"
    implementation "commons-beanutils:commons-beanutils:1.9.3"
    //implementation group: 'org.apache.commons', name: 'commons-csv', version:'1.4'
    implementation "com.opencsv:opencsv:5.0"
    implementation "org.slf4j:slf4j-log4j12:1.7.25"
    implementation "log4j:log4j:1.2.17"
    implementation "com.sun.jersey:jersey-client:1.8"
    implementation "com.sun.jersey:jersey-server:1.8"
    implementation "com.sun.jersey.contribs:jersey-multipart:1.8"
    implementation "com.thoughtworks.xstream:xstream:1.4.8"
    implementation "de.ruedigermoeller:fst:2.50"
    implementation "com.fasterxml.jackson.core:jackson-core:2.9.0.pr3"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.9.0.pr3"
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.9.0.pr3"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.9.0.pr3"
    implementation "com.google.guava:guava:19.0"
    implementation "net.arnx:jsonic:1.3.10"
    implementation "joda-time:joda-time:2.9.9"
    implementation "org.deephacks.lmdbjni:lmdbjni:0.4.6"
    implementation "org.deephacks.lmdbjni:lmdbjni-linux64:0.4.6"
    implementation "org.deephacks.lmdbjni:lmdbjni-osx64:0.4.6"
    implementation "org.deephacks.lmdbjni:lmdbjni-win64:0.4.6"
    implementation 'org.elasticsearch.client:elasticsearch-rest-high-level-client:7.14.1'
    testImplementation "junit:junit:4.12"
    testImplementation "org.hamcrest:hamcrest-all:1.3"
}

tasks.register('install') {
    dependsOn 'installShadowDist'
}

shadowJar {
    archiveClassifier = 'onejar'
    mergeServiceFiles()
    zip64 = true
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.named('distTar') { enabled = false }
tasks.named('distZip') { enabled = false }
tasks.named('shadowDistTar') { enabled = false }
tasks.named('shadowDistZip') { enabled = false }
