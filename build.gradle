buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url = 'https://plugins.gradle.org/m2/'
        }
    }

    dependencies {
        classpath "com.gradleup.shadow:shadow-gradle-plugin:${shadowPluginVersion}"
    }
}

apply plugin: 'application'
apply plugin: 'java'
apply plugin: 'java-library'
//apply plugin: 'maven'
apply plugin: 'maven-publish'
apply plugin: 'com.gradleup.shadow'

group = 'com.scienceminer.glutton'
version = '0.4.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.scienceminer.glutton.web.LookupServiceApplication'
}

repositories {
    mavenLocal()
    mavenCentral()
}

sourceSets.main.resources {
    srcDirs = ["src/main/resources"]
}

configurations {
    all*.exclude group: 'org.slf4j', module: "slf4j-log4j12"
    all*.exclude group: 'log4j', module: "log4j"
    all*.exclude group: 'log4j2', module: "log4j2"
    // superseded by com.fasterxml.woodstox:woodstox-core, keeping both breaks StAX service loading
    all*.exclude group: 'org.codehaus.woodstox', module: 'woodstox-core-asl'
}

tasks.register('install') {
    dependsOn 'installShadowDist'
}

dependencies {
    // Platforms — single source of truth for the versions of each stack.
    //   dropwizard-bom       manages the io.dropwizard artifacts,
    //   dropwizard-dependencies manages the third-party stack Dropwizard is built against:
    //                        Jetty, Jersey, Jackson, Metrics, Logback, ...
    // Taking both means Jetty and Metrics follow Dropwizard by construction rather than by hand.
    // Do not pin Jetty or Metrics separately: Dropwizard 5.0.2 is built against Metrics 4.2.39,
    // which pulls Jetty 12.1.9, while Metrics 4.2.40 pulls Jetty 12.1.12 — bumping Metrics alone
    // silently drags the whole server a patch ahead of the Jetty that Dropwizard was tested on.
    implementation platform("io.dropwizard:dropwizard-bom:${dropwizardVersion}")
    implementation platform("io.dropwizard:dropwizard-dependencies:${dropwizardVersion}")
    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")

    // JUnit 4 brings hamcrest-core 1.3, which overlaps with the unified org.hamcrest:hamcrest
    // artifact. Exclude it so a single hamcrest ends up on the test classpath.
    testImplementation('junit:junit:4.13.2') {
        exclude group: 'org.hamcrest'
    }
    testImplementation "org.hamcrest:hamcrest:${hamcrestVersion}"
    testImplementation "org.easymock:easymock:${easymockVersion}"
    testImplementation 'io.dropwizard:dropwizard-testing'
    testImplementation "io.dropwizard.modules:dropwizard-testing-junit4:${dropwizardTestingJunit4Version}"
    // Required so that JUnit 4 tests are discovered by useJUnitPlatform().
    // Without this, all test classes silently fail to execute (the build still
    // reports BUILD SUCCESSFUL because there are zero failures).
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
    // Gradle 9 no longer puts the JUnit Platform launcher on the test runtime classpath itself.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation "com.google.code.gson:gson:${gsonVersion}"

    //Dropwizard
    implementation "ru.vyarus:dropwizard-guicey:${guiceyVersion}"

    implementation 'io.dropwizard:dropwizard-core'
    implementation 'io.dropwizard:dropwizard-assets'
    implementation 'io.dropwizard:dropwizard-forms'
    implementation 'io.dropwizard:dropwizard-client'
    implementation 'io.dropwizard:dropwizard-auth'
    implementation 'io.dropwizard.metrics:metrics-core'

    // CrossOriginHandler/QoSHandler come from jetty-server, which Dropwizard already pulls in;
    // declared explicitly because LookupServiceApplication uses them directly. No version —
    // dropwizard-dependencies supplies the Jetty release that this Dropwizard is built against.
    implementation 'org.eclipse.jetty:jetty-server'

    // SLF4J + Logback are inherited from Dropwizard (SLF4J 2.x + Logback 1.5.x).
    // Do NOT pin them here to older versions — that would silently downgrade the runtime classpath.
    implementation "org.apache.logging.log4j:log4j-to-slf4j:${log4jToSlf4jVersion}"

    implementation "com.rockymadden.stringmetric:stringmetric-core_2.10:0.27.3"

    //Parsing XML/Json
    implementation "org.codehaus.woodstox:stax2-api:${stax2ApiVersion}"
    implementation "com.fasterxml.woodstox:woodstox-core:${woodstoxVersion}"

    implementation "org.lmdbjava:lmdbjava:${lmdbjavaVersion}"
    // FST 3.0.4-jdk17's POM erroneously declares a runtime dep on maven-bundle-plugin,
    // which transitively pulls maven-core 3.3.9 → guice 4.0 with classifier "no_aop".
    // After Gradle resolves Guice to the version forced by dropwizard-guicey, the classifier
    // survives and resolution fails because guice-<version>-no_aop.jar doesn't exist.
    // Exclude the offending maven-bundle-plugin tree.
    implementation("de.ruedigermoeller:fst:${fstVersion}") {
        exclude group: 'org.apache.felix', module: 'maven-bundle-plugin'
    }
    implementation "org.xerial.snappy:snappy-java:${snappyVersion}"
    implementation "com.github.luben:zstd-jni:${zstdJniVersion}"
    implementation "org.lz4:lz4-java:${lz4JavaVersion}"

    // S3 access for the ingestion inputs (see utils/io/InputLocation). The AWS BOM keeps the
    // SDK's own modules in step with each other. Only the sync S3 client is needed: the async
    // ones drag in Netty, and every ingestion reads whole objects sequentially, so the plain
    // URL-connection HTTP client is both enough and far smaller.
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation("software.amazon.awssdk:s3") {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'

    // Pin Apache HttpClient 4.x explicitly (was previously floating as a transitive of
    // elasticsearch-rest-high-level-client and the Crossref code). Used by CrossrefRequest,
    // ElasticSearchIndexer and MetadataMatching. The Grobid client no longer needs it.
    // Note: Dropwizard 5 itself moved to HttpClient 5; the two coexist under different packages.
    implementation "org.apache.httpcomponents:httpclient:${httpClient4Version}"

    implementation "org.elasticsearch.client:elasticsearch-rest-high-level-client:${elasticsearchRhlcVersion}"
    implementation "co.elastic.clients:elasticsearch-java:${elasticsearchJavaVersion}"
    // SolrIndexer only uses HttpSolrClient (Apache HttpClient 4). SolrJ's HTTP/2 client pulls the
    // Jetty 10 client stack, which collides with the Jetty 12 that Dropwizard 5 runs on — drop it.
    implementation("org.apache.solr:solr-solrj:${solrjVersion}") {
        exclude group: 'org.eclipse.jetty'
        exclude group: 'org.eclipse.jetty.http2'
        exclude group: 'org.eclipse.jetty.toolchain'
    }

    implementation "org.apache.commons:commons-collections4:${commonsCollections4Version}"
    implementation "commons-beanutils:commons-beanutils:${commonsBeanutilsVersion}"
    implementation "commons-io:commons-io:${commonsIoVersion}"
    implementation "org.apache.commons:commons-compress:${commonsCompressVersion}"

    implementation "org.tukaani:xz:${xzVersion}"

    implementation "com.fasterxml.jackson.core:jackson-core"
    implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation "com.fasterxml.jackson.module:jackson-module-afterburner"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml"

    implementation "com.opencsv:opencsv:${opencsvVersion}"
}

shadowJar {
    archiveClassifier = 'onejar'
    mergeServiceFiles()
    zip64 = true
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    exclude("logback.xml")
    // Keep the shadow default (INCLUDE): with EXCLUDE, Gradle drops duplicate entries before
    // ServiceFileTransformer sees them, so META-INF/services files from the Jersey, Jackson,
    // Lucene and Elasticsearch jars get silently truncated to whichever one is copied first.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('distTar') { enabled = false }
tasks.named('distZip') { enabled = false }
tasks.named('shadowDistTar') { enabled = false }

// arguments for exec tasks
ext.getArg = { propName, defaultVal ->
    return project.hasProperty(propName) ? project.getProperty(propName) : defaultVal
}

// JVM --add-opens flags required by FST 3.0.4-jdk17 and lmdbjava on Java 17+.
// Shared by every JavaExec task and the test task below.
//   - java.base/* opens cover the bulk of FST/lmdbjava reflection.
//   - java.sql/java.sql is needed for FST's serialization of java.sql.Timestamp.
ext.addOpensArgs = [
    "--add-opens", "java.base/java.nio=ALL-UNNAMED",
    "--add-opens", "java.base/sun.nio.ch=ALL-UNNAMED",
    "--add-opens", "java.base/java.text=ALL-UNNAMED",
    "--add-opens", "java.base/java.net=ALL-UNNAMED",
    "--add-opens", "java.base/java.lang=ALL-UNNAMED",
    "--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED",
    "--add-opens", "java.base/java.math=ALL-UNNAMED",
    "--add-opens", "java.base/java.util=ALL-UNNAMED",
    "--add-opens", "java.base/java.util.concurrent=ALL-UNNAMED",
    "--add-opens", "java.base/java.util.stream=ALL-UNNAMED",
    "--add-opens", "java.base/java.time=ALL-UNNAMED",
    "--add-opens", "java.base/java.io=ALL-UNNAMED",
    "--add-opens", "java.sql/java.sql=ALL-UNNAMED"
]

// Every CLI entry point of the service is the same main class with a different first argument.
def gluttonCommand = { String taskName, String group, List<String> commandArgs, String description ->
    tasks.register(taskName, JavaExec) {
        it.group = group
        it.description = description
        dependsOn 'classes'
        mainClass = application.mainClass
        classpath = sourceSets.main.runtimeClasspath
        args = commandArgs
        jvmArgs = ['-Xmx3072m'] + addOpensArgs
    }
}

gluttonCommand('server', 'service', ['server', getArg('config', 'config/glutton.yml')],
        'Start the biblio-glutton lookup/matching REST service')
gluttonCommand('crossref', 'data', ['crossref', '--input', getArg('input', ''), getArg('config', 'config/glutton.yml')],
        'Load a Crossref dump into the local storage')
gluttonCommand('gap_crossref', 'data', ['gap_crossref', getArg('config', 'config/glutton.yml')],
        'Fill the gap between the local Crossref data and the Crossref REST API')
gluttonCommand('hal', 'data', ['hal', getArg('config', 'config/glutton.yml')],
        'Harvest and load HAL metadata')
gluttonCommand('pmid', 'service', ['pmid', getArg('config', 'config/glutton.yml')],
        'Load the PMID/PMC/DOI mapping')
gluttonCommand('istex', 'data', ['istex', '--input', getArg('input', ''), getArg('config', 'config/glutton.yml')],
        'Load the ISTEX identifier mapping')
gluttonCommand('openalex', 'data', ['openalex', '--input', getArg('input', ''), getArg('config', 'config/glutton.yml')],
        'Load the OpenAlex open access links from a works snapshot, local or in S3')
gluttonCommand('openalex_update', 'data', ['openalex', '--since', getArg('since', ''), getArg('config', 'config/glutton.yml')],
        'Top up the OpenAlex open access links from the API since -Psince=YYYY-MM-DD (needs a paid OpenAlex plan)')
// only used it to re-create the search index from scratch, keeping the LMDB unchanged
gluttonCommand('index', 'search', ['index', getArg('config', 'config/glutton.yml')],
        'Rebuild the search index from the local storage')
// experimental
gluttonCommand('hal_audit', 'search', ['hal_audit', getArg('config', 'config/glutton.yml')],
        'Audit the HAL records against the local storage')

// Make ./gradlew run equivalent to ./gradlew server. The application plugin's
// auto-generated `run` task has none of the required CLI args or --add-opens
// JVM flags by default; wire them in explicitly here so contributors following
// Gradle convention (./gradlew run) get the same behavior as ./gradlew server.
tasks.named('run').configure {
    workingDir = rootProject.rootDir
    args = ['server', getArg('config', 'config/glutton.yml')]
    jvmArgs = ['-Xmx3072m'] + addOpensArgs
}

// The service reads config/glutton.yml from the filesystem, not from the jar, so its `version`
// entry cannot be filtered in at build time - it has to be edited by hand. Fail the build when it
// drifts from the project version, which is how 0.3-SNAPSHOT, 0.3 and 0.4-SNAPSHOT ended up
// disagreeing with each other across build.gradle, config/glutton.yml and the Readme.
tasks.register('checkConfigVersion') {
    group = 'verification'
    description = 'Verify that config/glutton.yml declares the project version'

    def configFile = layout.projectDirectory.file('config/glutton.yml')
    def expected = project.version.toString()
    inputs.file(configFile)
    inputs.property('projectVersion', expected)
    outputs.upToDateWhen { true }

    doLast {
        def declared = configFile.asFile.readLines()
            .find { it.startsWith('version:') }
            ?.substring('version:'.length())
            ?.trim()
        if (declared != expected) {
            throw new GradleException("config/glutton.yml declares version '${declared}' but the " +
                "project version is '${expected}'. Update the 'version' entry in config/glutton.yml.")
        }
    }
}

tasks.named('check') {
    dependsOn 'checkConfigVersion'
}

gluttonCommand('compression_benchmark', 'data', ['compression_benchmark', getArg('config', 'config/glutton.yml')],
        'Benchmark the compression algorithms on records of the existing Crossref LMDB')

test {
    useJUnitPlatform()

    testLogging.showStandardStreams = true
    // enable for having separate test executor for different tests
    forkEvery = 1
    maxHeapSize = "1024m"

    jvmArgs = addOpensArgs
}
