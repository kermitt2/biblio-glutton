# ---------------------------------------------------------------------------
# Dependency versions for biblio-glutton.
#
# Jetty, Jersey, Jackson, Metrics and Logback are deliberately absent: they come
# from the dropwizard-dependencies platform, so they always match the release the
# chosen Dropwizard was built and tested against. Pinning any of them here puts
# the server stack out of step with Dropwizard.
#
# dropwizard-guicey 8.x targets Dropwizard 5.x — bump the two together.
# ---------------------------------------------------------------------------

# Build plugins
shadowPluginVersion=9.6.1

# Dropwizard stack
dropwizardVersion=5.0.2
dropwizardTestingJunit4Version=5.0.0
guiceyVersion=8.0.2

# Search back-ends
elasticsearchJavaVersion=8.19.21
elasticsearchRhlcVersion=7.17.29
solrjVersion=9.10.1
awsSdkVersion=2.54.14

# Storage / serialization
lmdbjavaVersion=0.9.3
fstVersion=3.0.4-jdk17
snappyVersion=1.1.10.8
zstdJniVersion=1.5.7-3

# XML / JSON / CSV
stax2ApiVersion=4.3.0
woodstoxVersion=7.2.2
gsonVersion=2.14.0
opencsvVersion=5.12.0

# Commons and misc
commonsCollections4Version=4.6.0
commonsBeanutilsVersion=1.11.0
commonsIoVersion=2.22.0
commonsCompressVersion=1.28.0
xzVersion=1.12
httpClient4Version=4.5.14
log4jToSlf4jVersion=2.26.1

# Test
hamcrestVersion=3.0
easymockVersion=5.7.0
junitBomVersion=5.14.4
